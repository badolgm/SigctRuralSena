services:
  # Backend Django
  - type: web
    name: sigct-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    # 🛑 CAMBIO CRÍTICO: Nueva secuencia de comandos para estabilizar la instalación de Python/IA
    buildCommand: |
      # 1. Instalar dependencias del sistema operativo (para librerías de IA y OpenCV)
      sudo apt-get update -y
      sudo apt-get install -y build-essential libpq-dev libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libtiff-dev libwebp-dev python3-dev
      # 2. Continuar con la instalación de Python
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    # FIN DEL CAMBIO CRÍTICO
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: DATABASE_URL
        fromDatabase:
          name: sigct-db-prod
          property: connectionString
    healthCheckPath: /

  # Frontend React (sin cambios)
  - type: web
    name: sigct-frontend
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: VITE_API_URL
        value: https://sigct-backend.onrender.com

databases:
  - name: sigct-db-prod
    plan: free
    region: oregon
    databaseName: sigct_db
    user: sigct_user