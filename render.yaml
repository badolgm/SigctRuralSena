services:
  # Backend Django
  - type: web
    name: sigct-backend
    env: python
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    
    # ==========================================================
    # BUILD COMMAND OPTIMIZADO PARA RENDER
    # ==========================================================
    buildCommand: |
      # Instalar dependencias del sistema de forma más eficiente
      apt-get update -y && apt-get install -y build-essential libpq-dev libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libtiff-dev libwebp-dev python3-dev python3-venv
      
      # Instalar dependencias de Python
      pip install --upgrade pip setuptools wheel
      pip install --no-cache-dir -r requirements.txt
      
      # Migraciones y static files
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    
    # ==========================================================
    # START COMMAND OPTIMIZADO PARA ESTABILIDAD
    # ==========================================================
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 300 --max-requests 1000 --max-requests-jitter 100 --preload
    
    # ==========================================================
    # HEALTH CHECK CRÍTICO - DEBE APUNTAR A LA RAÍZ
    # ==========================================================
    healthCheckPath: /
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: DATABASE_URL
        fromDatabase:
          name: sigct-db-prod
          property: connectionString
      
      # ==========================================================
      # VARIABLES CRÍTICAS PARA ESTABILIDAD
      # ==========================================================
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PYTHONDONTWRITEBYTECODE
        value: 1
      
      # Variables adicionales para librerías de IA
      - key: LD_PRELOAD
        value: /usr/lib/x86_64-linux-gnu/libgomp.so.1
      - key: OPENCV_VIDEOIO_PRIORITY_MSMF
        value: 0

  # Frontend React
  - type: web
    name: sigct-frontend
    env: node
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    
    buildCommand: npm ci --legacy-peer-deps && npm run build
    
    staticPublishPath: ./dist
    
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_URL
        value: https://sigct-backend.onrender.com

databases:
  - name: sigct-db-prod
    plan: free
    region: oregon
    databaseName: sigct_db
    user: sigct_user