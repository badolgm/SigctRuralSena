services:
  # Backend Django
  - type: web
    name: sigct-backend
    env: python
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    
    # ==========================================================
    # CORRECCIÓN CRÍTICA AQUÍ:
    # 1. Ejecutar el script de dependencias (que está en el root: ../)
    # 2. Continuar con la instalación de Python
    # ==========================================================
    buildCommand: |
      chmod +x ../install_system_deps.sh
      ../install_system_deps.sh
      pip install --upgrade pip setuptools wheel
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: DATABASE_URL
        fromDatabase:
          name: sigct-db-prod
          property: connectionString
      # Variables adicionales para librerías de IA
      - key: LD_PRELOAD
        value: /usr/lib/x86_64-linux-gnu/libgomp.so.1
      - key: OPENCV_VIDEOIO_PRIORITY_MSMF
        value: 0
    
    healthCheckPath: /admin/login/

  # Frontend React
  - type: web
    name: sigct-frontend
    env: node
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    
    buildCommand: npm ci --legacy-peer-deps && npm run build
    
    staticPublishPath: ./dist
    
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_URL
        value: https://sigct-backend.onrender.com

databases:
  - name: sigct-db-prod
    plan: free
    region: oregon
    databaseName: sigct_db
    user: sigct_user